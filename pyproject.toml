[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algobot"
version = "0.1.0"
description = "A backtest-first algorithmic trading bot framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4"]

[project.scripts]
algobot = "algobot.cli:main"

[tool.setuptools.packages.find]
include = ["algobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
